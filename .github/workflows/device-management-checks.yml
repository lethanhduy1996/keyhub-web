name: Device management web syntax check
on:
  push:
    branches: [feature/device-management-v2]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
